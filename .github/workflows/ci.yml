name: Continuous Integration

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aiken-lang/setup-aiken@v1.0.3
        with:
          version: v1.1.23
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm
          cache-dependency-path: tools/advanced-parameter-prefix/pnpm-lock.yaml
      - run: pnpm --dir tools/advanced-parameter-prefix install --frozen-lockfile
      - run: pnpm --dir tools/advanced-parameter-prefix typecheck
      - run: pnpm --dir tools/advanced-parameter-prefix generate -- --env default
      - run: pnpm --dir tools/advanced-parameter-prefix generate -- --env testnet
      - run: git diff --exit-code -- env/default.ak env/testnet.ak
      - run: aiken fmt --check
      - run: aiken check --max-success 50
      - run: aiken build
      - run: aiken docs -o docs
      - run: git diff --name-only --exit-code aiken.lock
      - uses: actions/upload-pages-artifact@v4
        with:
          path: "docs/"

  publish-documentation:
    if: ${{ github.event_name == 'push' }}
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
